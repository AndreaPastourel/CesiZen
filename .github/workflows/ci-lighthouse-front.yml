
name: Front - Lighthouse


on:
  push:
    branches:
      - "**"
    paths:
      - "web-react/**"
      - ".github/workflows/ci-lighthouse-front.yml"

  pull_request:
    branches:
      - main
      - dev
    paths:
      - "web-react/**"
      - ".github/workflows/ci-lighthouse-front.yml"

permissions:
  contents: read

jobs:

  lighthouse:
    name: Audit Lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react

    
    steps:
  
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

          cache-dependency-path: web-react/package-lock.json

      - name: Installation de Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Installation des dépendances
        run: npm ci

      - name: Audit Lighthouse
        run: npm run lighthouse
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}


      - name: Conservation des rapports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report

          path: |
            web-react/lighthouse-report.report.html
            web-react/lighthouse-report.report.json

          if-no-files-found: warn

          retention-days: 14