name: Front - Security

on:
  push:
    branches:
      - main
      - dev
      - "**"

  pull_request:
    branches:
      - main
      - dev

jobs:

  dependency-scan:
    name: Analyse des dépendances
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-react

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Audit npm
        run: npm audit --audit-level=high
        continue-on-error: true


  secret-scan:
    name: Recherche de secrets
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source="/repo" \
            --verbose


  semgrep:
    name: Analyse Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Semgrep
        run: pip install semgrep

      - name: Scan Semgrep
        run: semgrep scan --config auto web-react