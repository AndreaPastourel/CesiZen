name: Back - Quality

on:
  push:
    branches:
      - "**"
    paths:
      - "api-symfony/**"
      - ".github/workflows/ci-quality-back.yml"

  pull_request:
    branches:
      - main
      - dev
    paths:
      - "api-symfony/**"
      - ".github/workflows/ci-quality-back.yml"

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-symfony

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl

      - name: Installation des dépendances
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validation de Composer
        run: composer validate --strict

      - name: Vérification de la syntaxe PHP
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Vérification des fichiers YAML
        run: php bin/console lint:yaml config/

      - name: Vérification du conteneur Symfony
        run: php bin/console lint:container