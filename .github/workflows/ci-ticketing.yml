name: CI - Ticketing Jira


on:
  workflow_run:
   
    workflows:
      - "Back - API"
      - "Back - Docker"
      - "Front - Docker"
      - "Front - E2E"
      - "Front - Lighthouse"
      - "Back - Quality"
      - "Front - Quality"
      - "Global - Secrets"
      - "Back - Security"
      - "Front - Security"
      - "Global - SonarCloud"
      - "Back - Tests"
      - "Front - Tests"
      - "Back - OWASP ZAP"
      - "Front - OWASP ZAP"

    types:
      - completed


permissions:
  contents: read


env:
  JIRA_PROJECT_KEY: "CZ"
  JIRA_ISSUE_TYPE: "Task"

concurrency:
 
  group: ci-ticketing-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  jira-ticket:
   
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on: ubuntu-latest

    steps:
    
      - name: Préparer les informations de la CI

        id: metadata

        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}

        run: |
        
          WORKFLOW_SLUG=$(printf '%s' "$WORKFLOW_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')

       
          WORKFLOW_LABEL="ci-${WORKFLOW_SLUG}"

          SEVERITY="high"

          case "$WORKFLOW_NAME" in

            "Global - Secrets"|"Back - Security"|"Front - Security"|"Back - OWASP ZAP"|"Front - OWASP ZAP")
              SEVERITY="critical"
              ;;

            "Back - Quality"|"Front - Quality"|"Front - Lighthouse")
              SEVERITY="medium"
              ;;

            *)
              SEVERITY="high"
              ;;
          esac

          echo "workflow_label=$WORKFLOW_LABEL" >> "$GITHUB_OUTPUT"

          echo "severity=$SEVERITY" >> "$GITHUB_OUTPUT"

          echo "Workflow surveillé : $WORKFLOW_NAME"
          echo "Label Jira : $WORKFLOW_LABEL"
          echo "Sévérité : $SEVERITY"

    
      - name: Chercher un ticket Jira déjà ouvert
        id: search

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          WORKFLOW_LABEL: ${{ steps.metadata.outputs.workflow_label }}

        run: |
         
          JQL="project = ${JIRA_PROJECT_KEY} AND labels = \"ci-auto\" AND labels = \"${WORKFLOW_LABEL}\" AND statusCategory != Done ORDER BY created DESC"

          SEARCH_PAYLOAD=$(jq -n \
            --arg jql "$JQL" \
            '{
              jql: $jql,
              maxResults: 1,
              fields: ["key", "status"]
            }')

          SEARCH_RESPONSE=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/search/jql" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$SEARCH_PAYLOAD")

          ISSUE_KEY=$(printf '%s' "$SEARCH_RESPONSE" | jq -r '.issues[0].key // empty')

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"

          if [ -n "$ISSUE_KEY" ]; then
            echo "Ticket ouvert trouvé : $ISSUE_KEY"
          else
            echo "Aucun ticket ouvert pour $WORKFLOW_LABEL"
          fi

      - name: Créer un ticket Jira si la CI échoue

        if: >-
          github.event.workflow_run.conclusion == 'failure' &&
          steps.search.outputs.issue_key == ''

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_LABEL: ${{ steps.metadata.outputs.workflow_label }}
          SEVERITY: ${{ steps.metadata.outputs.severity }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}

        run: |
          SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-8)

          SUMMARY="[CI][CESIZen] ${WORKFLOW_NAME} en échec sur dev"

          CREATE_PAYLOAD=$(jq -n \
            --arg project "$JIRA_PROJECT_KEY" \
            --arg issue_type "$JIRA_ISSUE_TYPE" \
            --arg summary "$SUMMARY" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg workflow_label "$WORKFLOW_LABEL" \
            --arg severity_label "severity-$SEVERITY" \
            '{
              fields: {
                project: {
                  key: $project
                },
                issuetype: {
                  name: $issue_type
                },
                summary: $summary,
                labels: [
                  "cesizen",
                  "ci-auto",
                  $workflow_label,
                  $severity_label
                ],
                description: {
                  type: "doc",
                  version: 1,
                  content: [
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: ("Le workflow " + $workflow + " a échoué sur la branche dev.")
                        }
                      ]
                    },
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: ("Commit : " + $sha)
                        }
                      ]
                    },
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: ("Déclenché par : " + $actor)
                        }
                      ]
                    },
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: ("Run GitHub Actions : " + $run_url)
                        }
                      ]
                    }
                  ]
                }
              }
            }')

          CREATE_RESPONSE=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/issue" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$CREATE_PAYLOAD")

          CREATED_KEY=$(printf '%s' "$CREATE_RESPONSE" | jq -r '.key')

          echo "Ticket Jira créé : $CREATED_KEY"


      - name: Mettre à jour le ticket si la CI échoue encore

        if: >-
          github.event.workflow_run.conclusion == 'failure' &&
          steps.search.outputs.issue_key != ''

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.search.outputs.issue_key }}

          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

        run: |
          SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-8)

          COMMENT_PAYLOAD=$(jq -n \
            --arg sha "$SHORT_SHA" \
            --arg run_url "$RUN_URL" \
            '{
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("Nouvel échec détecté sur dev — commit " + $sha + ".")
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("Run GitHub Actions : " + $run_url)
                      }
                    ]
                  }
                ]
              }
            }')

          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$COMMENT_PAYLOAD" \
            > /dev/null

          echo "Ticket $ISSUE_KEY conservé : commentaire ajouté, aucun doublon créé."


      - name: Ajouter un commentaire de résolution

        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          steps.search.outputs.issue_key != ''

        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.search.outputs.issue_key }}

          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

        run: |
        
          SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-8)

          COMMENT_PAYLOAD=$(jq -n \
            --arg sha "$SHORT_SHA" \
            --arg run_url "$RUN_URL" \
            '{
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("La CI est de nouveau fonctionnelle sur dev avec le commit " + $sha + ".")
                      }
                    ]
                  },
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: ("Run GitHub Actions : " + $run_url)
                      }
                    ]
                  }
                ]
              }
            }')

          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$COMMENT_PAYLOAD" \
            > /dev/null

          echo "Commentaire de résolution ajouté à $ISSUE_KEY."

    
      - name: Passer automatiquement le ticket en terminé

        
        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          steps.search.outputs.issue_key != ''

        env:

          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

   
          ISSUE_KEY: ${{ steps.search.outputs.issue_key }}

        run: |
        
          TRANSITIONS=$(curl --silent --show-error --fail-with-body \
            --request GET \
            --url "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json")

        
          TRANSITION_ID=$(printf '%s' "$TRANSITIONS" \
            | jq -r '.transitions[] | select(.to.statusCategory.key == "done") | .id' \
            | head -n 1)

         
          if [ -z "$TRANSITION_ID" ]; then
            echo "Aucune transition vers une catégorie Done n'est disponible pour $ISSUE_KEY."
            exit 1
          fi

        
          TRANSITION_PAYLOAD=$(jq -n \
            --arg transition_id "$TRANSITION_ID" \
            '{
              transition: {
                id: $transition_id
              }
            }')

          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/issue/$ISSUE_KEY/transitions" \
            --user "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$TRANSITION_PAYLOAD" \
            > /dev/null

          echo "Ticket $ISSUE_KEY passé automatiquement en terminé."

   
      - name: Aucun ticket à fermer

        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          steps.search.outputs.issue_key == ''

        run: echo "La CI est verte et aucun ticket ouvert ne correspond à ce workflow."
