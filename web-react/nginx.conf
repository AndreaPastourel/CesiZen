server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    index index.html;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:8000; font-src 'self' data:; connect-src 'self' http://localhost:8000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;


    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
    }

  
    location / {
       
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}