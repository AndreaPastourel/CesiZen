name: Front - Quality

on:
  push:
    branches:
      - dev
      - main
      - "**/**"

  pull_request:
    branches:
      - dev
      - main

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification ESLint
        run: npm run lint

      - name: Build Vite
        run: npm run build