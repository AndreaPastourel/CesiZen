security:
    password_hashers:
        App\Entity\UTILISATEURS:
            algorithm: auto

    role_hierarchy:
        ROLE_MODERATEUR: ROLE_USER
        ROLE_ADMIN: ROLE_MODERATEUR
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        app_user_provider:
            entity:
                class: App\Entity\UTILISATEURS
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|css|images|js)/
            security: false

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: motDePasse
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: App\Security\AuthenticationFailureHandler

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/ressources, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
