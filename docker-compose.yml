services:

  # Base de données MySQL
  db:
    image: mysql:8.4
    container_name: cesizen-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  # API Symfony
  back:
    build:
      context: ./CesiZen_API
      dockerfile: Dockerfile

    container_name: cesizen-api
    restart: unless-stopped

    depends_on:
      - db

    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "${BACK_PORT}:8000"


  # Front React / Vite
  front:
    build:
      context: ./web-react
      dockerfile: Dockerfile

    container_name: cesizen-front
    restart: unless-stopped

    depends_on:
      - back

    ports:
      - "${FRONT_PORT}:8080"


  # Collecte des métriques
  prometheus:
    image: prom/prometheus:latest
    container_name: cesizen-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"


  # Métriques des conteneurs Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cesizen-cadvisor
    restart: unless-stopped

    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    ports:
      - "8081:8080"


  # Dashboard de supervision
  grafana:
    image: grafana/grafana:latest
    container_name: cesizen-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    volumes:
      - grafana_data:/var/lib/grafana

    ports:
      - "3001:3000"


# Volumes persistants
volumes:
  mysql_data:
  prometheus_data:
  grafana_data: